site_name: Crash Documentation
site_description: Public docs for Crash, a provably fair crash game played with demo coins (formerly BTCGambler).
theme:
  name: material
  palette:
    scheme: slate  # dark mode default
nav:
  - Home: index.md
  - Features: features.md
  - Architecture: architecture.md
  - Setup: setup.md
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
extra_css:
  - stylesheets/custom-admonitions.css
extra_javascript:
  - javascript/maintainence-check.js
